[package]
name = "settlement"
version = "0.10.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace]
members = ["xtask"]
default-members = [".", "xtask"]
resolver = "3"

[dependencies]
axum = { version = "0.8", features = ["json", "query", "tokio", "http1"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.7", features = ["fs", "limit", "timeout"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
chrono = { version = "0.4", features = ["serde"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
fernet = { version = "0.2", default-features = false, features = ["rustcrypto"] }
rand = "0.8"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
csv = "1"
regex = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
mimalloc = { version = "0.1.52", features = ["secure"] }
fs2 = "0.4"
libsqlite3-sys = "0.30.1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = "line-tables-only"
