[package]
name = "settlement-tools"
version = "0.13.3"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
settlement = { path = ".." }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
mimalloc = { version = "0.1.52", features = ["secure"] }
tar = "0.4"
flate2 = "1"
toml = "1"
csv = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "sqlite-bundled"] }
