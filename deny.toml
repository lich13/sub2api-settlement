[advisories]
# sqlx-mysql/rsa are lockfile-only optional dependencies. CI separately rejects
# them in the compiled feature graph; removing that check invalidates this waiver.
# RUSTSEC-2026-0459 (libsqlite3-sys 0.30.1, WAL uninitialized-memory read, local only) is
# waived until 2027-01-11. Fix needs libsqlite3-sys >= 0.39, which sqlx 0.8/0.9.0 forbid;
# waiting for the sqlx release tracked in launchbadge/sqlx#4516 / PR #4517. cargo-deny has
# no native expiry: the `security` job in ci.yml fails after the date.
ignore = [
    "RUSTSEC-2023-0071",
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.30.1 local-only WAL info leak; blocked on sqlx release allowing libsqlite3-sys >=0.39 (sqlx#4516); review by 2027-01-11" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "OpenSSL", "MPL-2.0", "Unlicense", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
